<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Yamen Morcel, software developer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .edges line { stroke: #5EEAD4; stroke-opacity: .18; stroke-width: 1.5; }
    .nodes circle { fill: #0B1220; stroke: #5EEAD4; stroke-width: 2.5; animation: pulse 4.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .glow { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes pulse { 0%, 100% { fill: #0B1220; } 15% { fill: #5EEAD4; } 35% { fill: #0B1220; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { to { transform: translate(-60px, 20px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity=".12"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="glow" cx="980" cy="90" r="260" fill="url(#g1)"/>
    <circle class="glow" cx="160" cy="330" r="240" fill="url(#g2)" style="animation-delay:-6s"/>

    <text x="80" y="112" class="mono" font-size="22" fill="#5EEAD4">~ $ whoami<tspan class="cursor" fill="#5EEAD4"> ▍</tspan></text>
    <text x="78" y="186" class="sans" font-size="68" font-weight="700" fill="#F1F5F9" letter-spacing="-1">Yamen Morcel</text>
    <text x="80" y="232" class="mono" font-size="20" fill="#94A3B8">software developer <tspan fill="#5EEAD4">·</tspan> web <tspan fill="#5EEAD4">·</tspan> desktop <tspan fill="#5EEAD4">·</tspan> embedded <tspan fill="#5EEAD4">·</tspan> ML</text>
    <rect x="80" y="258" width="64" height="4" rx="2" fill="#5EEAD4"/>

    <g class="edges"><line x1="850" y1="105" x2="960" y2="80"/><line x1="850" y1="105" x2="960" y2="133"/><line x1="850" y1="105" x2="960" y2="186"/><line x1="850" y1="105" x2="960" y2="239"/><line x1="850" y1="160" x2="960" y2="80"/><line x1="850" y1="160" x2="960" y2="133"/><line x1="850" y1="160" x2="960" y2="186"/><line x1="850" y1="160" x2="960" y2="239"/><line x1="850" y1="215" x2="960" y2="80"/><line x1="850" y1="215" x2="960" y2="133"/><line x1="850" y1="215" x2="960" y2="186"/><line x1="850" y1="215" x2="960" y2="239"/><line x1="960" y1="80" x2="1070" y2="133"/><line x1="960" y1="80" x2="1070" y2="186"/><line x1="960" y1="133" x2="1070" y2="133"/><line x1="960" y1="133" x2="1070" y2="186"/><line x1="960" y1="186" x2="1070" y2="133"/><line x1="960" y1="186" x2="1070" y2="186"/><line x1="960" y1="239" x2="1070" y2="133"/><line x1="960" y1="239" x2="1070" y2="186"/></g>
    <g class="nodes"><circle cx="850" cy="105" r="8" style="animation-delay:0.00s"/><circle cx="850" cy="160" r="8" style="animation-delay:0.35s"/><circle cx="850" cy="215" r="8" style="animation-delay:0.70s"/><circle cx="960" cy="80" r="8" style="animation-delay:1.05s"/><circle cx="960" cy="133" r="8" style="animation-delay:1.40s"/><circle cx="960" cy="186" r="8" style="animation-delay:1.75s"/><circle cx="960" cy="239" r="8" style="animation-delay:2.10s"/><circle cx="1070" cy="133" r="8" style="animation-delay:2.45s"/><circle cx="1070" cy="186" r="8" style="animation-delay:2.80s"/></g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="19.5" fill="none" stroke="#5EEAD4" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
